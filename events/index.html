<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | FOSS</title>
    <link rel="stylesheet" href="/fonts/font.css" />
    <script defer src="/dmode.js"></script>
    <script defer src="events.js"></script>
    <link rel="stylesheet" href="events.css">

    <link id="h1n1" rel="stylesheet" href="/style.css" />
</head>
<style>
    .cOntents {
        width: 70vw;
    }


    @media screen and (max-width: 800px) {
        .cOntents {
            width: 90vw;
        }

        .cOntents {
            border-radius: 8px;
        }
    }
</style>

<body style="
			display: flex;
			flex-direction: column;
			align-content: center;
			align-items: center;
			justify-content: space-between;
			height: unset;
            opacity: 0;
            transition: opacity 0.3s ease;
		">
    <div class="headder">
        <img src="/arrBWD_black.png" id="back" onclick="location.href='/'" style="cursor: pointer" />
        <img src="/Evantage_dark_HZ.png" id="headerLogo" onclick="location.href='/'" />
    </div>
    <div style="height: 100px; width: 100%"></div>
    <!-- Second Page Header (Shown when a card is selected) -->
    <div id="year-active-bar" class="year-active-bar" style="display: none;">
        <button id="back-to-years-btn" class="back-to-years-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
            Back
        </button>
        <span class="active-year-title" id="active-year-title">2026</span>
    </div>

    <!-- Front Page: Direct Cards Grid (Year cards + UPCOMING EVENTS card) -->
    <section id="year-hub-container" class="year-hub-container"></section>

    <!-- Second Page: Event Poster Grid -->
    <main id="card-container" class="poster-grid-container" style="display: none;"></main>
    <div style="height: 45px; width: 100%"></div>


</body>

</html>
