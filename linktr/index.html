<!DOCTYPE html>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background: #0f172a;
				color: #fff;
				font-family: "Segoe UI", sans-serif;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				padding: 1rem;
			}

			.container {
				max-width: 500px;
				width: 100%;
				text-align: center;
			}

			.logo {
				width: 200px;
				margin-bottom: 1rem;
			}

			h1 {
				font-size: 2rem;
				margin-bottom: 0.5rem;
			}

			.subtitle {
				color: #94a3b8;
				margin-bottom: 2rem;
			}

			.links {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			.links a {
				display: block;
				background: #1e293b;
				color: #fff;
				text-decoration: none;
				padding: 1rem;
				border-radius: 12px;
				transition: all 0.3s ease;
			}

			.links a:hover {
				background: #334155;
				transform: scale(1.03);
			}

			footer {
				margin-top: 2rem;
				color: #64748b;
				font-size: 0.9rem;
			}
			.copyright {
				text-align: center;
				margin-top: 30px;
				color: #aaa;
				font-size: 14px;
			}
			.links i {
				color: greenyellow;
			}
			.waterMark {
				background: url("/IMG_20250806_125011.png") no-repeat center center;
				width: 100vw;
				height: 100vh;
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				opacity: 0;
				transition: 700ms;
				pointer-events: none; /* Prevents blocking clicks */
			}
		</style>
	</head>
	<body>

				function addWaterMarkHover(selector, opacity) {
					let timer;
					const el = document.querySelector(selector);
					const waterMark = document.querySelector(".waterMark");
					el.addEventListener("mouseover", function () {
						timer = setTimeout(() => {
							waterMark.style.opacity = opacity;
						}, 1000);
					});
					el.addEventListener("mouseout", function () {
						clearTimeout(timer);
						waterMark.style.opacity = "0";
					});
				}

      
				addWaterMarkHover(".off", "0.1");
				addWaterMarkHover(".git", "0.2");
				addWaterMarkHover(".inst", "0.3");
				addWaterMarkHover(".discord", "0.4");
				addWaterMarkHover(".hack", "0.5");
				addWaterMarkHover(".whatsapp", "0.6");
				addWaterMarkHover(".linkedin", "0.7");
				addWaterMarkHover(".copyright", "0.7");
			</script>
