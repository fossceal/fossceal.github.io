<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chambers | FOSS</title>
    <link rel="stylesheet" href="/fonts/font.css" />
    <script defer src="/dmode.js"></script>
    <link id="h1n1" rel="stylesheet" href="/style.css" />

    <style>
        .grid-container {
            width: 90vw;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
            justify-content: center;
            justify-items: center;
            padding: 20px 0 60px;
        }

        .champ {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .champ:hover {
            transform: translateY(-8px);
            filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.3));
        }

        .champ img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
    </style>
</head>

<body style="
			display: flex;
			flex-direction: column;
			align-content: center;
			align-items: center;
			justify-content: space-between;
			height: 100vh;
            margin: 0;
            overflow-x: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        ">

    <div class="headder">
        <img src="/arrBWD_black.png" id="back" onclick="location.href='/explore.html'" style="cursor: pointer" />
        <img src="/Evantage_dark_HZ.png" id="headerLogo" onclick="location.href='/'" />
    </div>

    <div style="height: 120px; width: 100%"></div>

    <div class="grid-container">
        <div class="champ" onclick="location.href='/chamber/101/create.html'">
            <img src="/chamber/101/create.png" alt="Create 101" />
        </div>
        <div class="champ" onclick="location.href='/chamber/202/embed.html'">
            <img src="/chamber/202/embed.png" alt="Embed 202" />
        </div>
        <div class="champ" onclick="location.href='/chamber/303/train.html'">
            <img src="/chamber/303/train.png" alt="Train 303" />
        </div>
        <div class="champ" onclick="location.href='/chamber/404/hack.html'">
            <img src="/chamber/404/hack.png" alt="Hack 404" />
        </div>
        <div class="champ" onclick="location.href='/chamber/505/deploy.html'">
            <img src="/chamber/505/deploy.png" alt="Deploy 505" />
        </div>
    </div>

    <div style="height: 40px; width: 100%"></div>
</body>

</html>
