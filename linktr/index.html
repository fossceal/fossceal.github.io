	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 1rem;
		}

		.container {
			/* max-width: 500px; */
			width: 100%;
			text-align: center;
		}

		.logo {
			width: 200px;
			margin-bottom: 1rem;
		}

		h1 {
			font-size: 2rem;
			margin-bottom: 0.5rem;
		}

		.subtitle {
			color: #94a3b8;
			margin-bottom: 2rem;
		}

		.links {
			display: flex;
            gap: 15px; 
            max-width: min(500px,80vw) ;
			justify-content: center;
            margin: 0 auto;
			flex-wrap: wrap;
		}

		.links a 
		{
			display: flex; 
   			justify-content: center;
            align-items: center;
            text-align: center;
            background: #38dd6a;
            border: 1px solid currentColor;
            color: #000;
            text-decoration: none;
			aspect-ratio: 1/1;
            padding: 1rem ; 
            border-radius: 12px;
            transition: all 0.3s ease;
            opacity: 0.8;
			width: 60px;
		}

		.links a:hover {
			background: #ec75cb;
			transform: scale(1.03);

		}

		footer {
			margin-top: 2rem;
			color: #64748b;
			font-size: 0.9rem;
		}

		.copyright {
			text-align: center;
			margin-top: 30px;
			color: #aaa;
			font-size: 14px;
		}

		.links i {
			color: rgb(255, 255, 255);
		}
	</style>
