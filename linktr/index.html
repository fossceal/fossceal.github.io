<!doctype html>
<html lang="en">
	<head>
		<head>
			<meta charset="UTF-8" />
			<meta name="viewport" content="width=device-width, initial-scale=1.0" />
			<title>FOSS CEAL | Linktree</title>
			<link id="h1n1" rel="stylesheet" href="/style.css" />

			<link rel="stylesheet" href="/fonts/font.css" />

			<script
				src="https://kit.fontawesome.com/cb7f83baaf.js"
				crossorigin="anonymous"
			></script>
			<script defer src="/dmode.js"></script>
		</head>

		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				padding: 1rem;
			}

			.container {
				/* max-width: 500px; */
				width: 100%;
				text-align: center;
			}

			.logo {
				width: 200px;
				margin-bottom: 1rem;
			}

			h1 {
				font-size: 2rem;
				margin-bottom: 0.5rem;
			}

			.subtitle {
				color: #94a3b8;
				margin-bottom: 2rem;
			}

			.links {
				display: flex;
				gap: 12px;
				max-width: min(560px, 90vw);
				justify-content: center;
				margin: 0 auto;
				flex-wrap: wrap;
			}

			.link-item {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.45rem;
			}

			.link-label {
				font-size: 0.6rem;
				font-weight: 700;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: #64748b;
				line-height: 1;
			}

			.links a {
				display: flex;
				justify-content: center;
				align-items: center;
				text-align: center;
				background: #38dd6a;
				border: 1px solid currentColor;
				color: #000;
				text-decoration: none;
				aspect-ratio: 1/1;
				padding: 1rem;
				border-radius: 12px;
				transition: all 0.3s ease;
				opacity: 0.8;
				width: 60px;
			}

			.links a:hover {
				background: #ec75cb;
				transform: scale(1.03);
			}

			footer {
				margin-top: 2rem;
				color: #64748b;
				font-size: 0.9rem;
			}

			.copyright {
				text-align: center;
				margin-top: 30px;
				color: #aaa;
				font-size: 14px;
			}

			.links i {
				color: #000;
			}

			/* Instagram Popup */
			.insta-overlay {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.45);
				backdrop-filter: blur(4px);
				-webkit-backdrop-filter: blur(4px);
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 999;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.25s ease;
			}
			.insta-overlay.active {
				opacity: 1;
				pointer-events: all;
			}
			.insta-popup {
				background: white;
				background-image: radial-gradient(black 1px, transparent 0);
				background-size: 40px 40px;
				background-position: -17px -17px;
				border: 0.5px solid rgba(0, 0, 0, 0.775);
				outline: 1px solid grey;
				border-radius: 25px;
				padding: 10px;
				max-width: 340px;
				width: 90vw;
				text-align: center;
				box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.3);
				transform: translateY(24px) scale(0.96);
				transition:
					transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
					opacity 0.25s ease;
				opacity: 0;
			}
			.insta-overlay.active .insta-popup {
				transform: translateY(0) scale(1);
				opacity: 1;
			}
			.insta-popup .popup-inner {
				background: white;
				border-radius: 18px;
				padding: 1.6rem 1.4rem 1.4rem;
			}
			.insta-popup .popup-icon {
				font-size: 2.2rem;
				background: linear-gradient(
					45deg,
					#f09433,
					#e6683c,
					#dc2743,
					#cc2366,
					#bc1888
				);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
				margin-bottom: 0.5rem;
			}
			.insta-popup h3 {
				color: #000;
				font-size: 1.1rem;
				font-weight: 800;
				margin-bottom: 0.3rem;
				font-family: "Open Sans", sans-serif;
			}
			.insta-popup p {
				color: #555;
				font-size: 0.82rem;
				margin-bottom: 1.3rem;
			}
			.insta-popup .popup-btns {
				display: flex;
				flex-direction: column;
				gap: 0.65rem;
			}
			.insta-popup .popup-btns a {
				display: flex;
				align-items: center;
				gap: 0.7rem;
				padding: 0.75rem 1.1rem;
				border-radius: 12px;
				text-decoration: none;
				font-size: 0.9rem;
				font-weight: 700;
				transition: transform 0.2s ease, box-shadow 0.2s ease;
				width: auto;
				aspect-ratio: unset;
				opacity: 1;
				border: 2px solid #000;
			}
			.insta-popup .popup-btns a:hover {
				transform: scale(1.03);
				box-shadow: 0 4px 16px rgba(0,0,0,0.18);
			}
			.insta-popup .popup-btns a.btn-chamber {
				background: #38dd6a;
				color: #000;
			}
			.insta-popup .popup-btns a.btn-chamber:hover {
				background: #ec75cb;
			}
			.insta-popup .popup-btns a.btn-foss {
				background: #000;
				color: #fff;
				border-color: #000;
			}
			.insta-popup .popup-btns a.btn-foss:hover {
				background: #222;
			}
			.insta-popup .popup-btns a.btn-chamber i {
				color: #000;
				font-size: 1.05rem;
			}
			.insta-popup .popup-btns a.btn-foss i {
				color: #fff;
				font-size: 1.05rem;
			}
			.insta-popup .popup-close {
				margin-top: 1rem;
				background: none;
				border: none;
				color: #64748b;
				font-size: 0.8rem;
				cursor: pointer;
				transition: color 0.2s;
			}
			.insta-popup .popup-close:hover {
				color: #94a3b8;
			}

			/* Instagram trigger button styled same as other .links a */
			.insta-trigger {
				display: flex;
				justify-content: center;
				align-items: center;
				text-align: center;
				background: #38dd6a;
				border: 1px solid currentColor;
				color: #000;
				aspect-ratio: 1/1;
				padding: 1rem;
				border-radius: 12px;
				transition: all 0.3s ease;
				opacity: 0.8;
				width: 60px;
				cursor: pointer;
			}
			.insta-trigger:hover {
				background: #ec75cb;
				transform: scale(1.03);
			}
			.insta-trigger i {
				color: #000;
				pointer-events: none;
			}
		</style>
	</head>

	<body style="opacity: 0; transition: opacity 0.3s ease">
		<div class="container">
			<img
				src="/Evantage_dark_HZ.png"
				alt="FOSS Club Logo"
				id="headerLogo"
				class="logo"
				ondblclick="alert('who dare touch my tralala? \n - HGP')"
			/>
			<h1>FOSS CEAL</h1>
			<p class="subtitle">Open Source • Community • Learning</p>

			<div class="links">
				<div class="link-item">
					<a href="https://foss.ceal.in/" target="_blank" class="off">
						<i class="fas fa-globe"></i>
					</a>
					<span class="link-label">Website</span>
				</div>
				<div class="link-item">
					<a href="https://github.com/fossceal" target="_blank" class="git">
						<i class="fab fa-github"></i>
					</a>
					<span class="link-label">GitHub</span>
				</div>
				<div class="link-item">
					<div
						class="insta-trigger inst"
						id="instaBtn"
						onclick="
							document.getElementById('instaOverlay').classList.add('active')
						"
					>
						<i class="fab fa-instagram"></i>
					</div>
					<span class="link-label">Instagram</span>
				</div>
				<div class="link-item">
					<a
						href="https://discord.gg/N64AWcKFQN"
						target="_blank"
						class="discord"
					>
						<i class="fab fa-discord"></i>
					</a>
					<span class="link-label">Discord</span>
				</div>
				<div class="link-item">
					<a
						href="https://whatsapp.com/channel/0029Vb7PEhoB4hdSCGvrQS3c"
						target="_blank"
						class="hack"
					>
						<i class="fab fa-whatsapp"></i>
					</a>
					<span class="link-label">WhatsApp</span>
				</div>
				<div class="link-item">
					<a
						href="https://www.linkedin.com/company/foss-ceal/?viewAsMember=true"
						target="_blank"
						class="linkedin"
					>
						<i class="fab fa-linkedin"></i>
					</a>
					<span class="link-label">LinkedIn</span>
				</div>
			</div>

			<footer>
				<div class="copyright">
					<p>
						© Copyright
						<strong>FOSS CEAL | TRAIN 303 <span id="yr"></span></strong>. All
						Rights Reserved
					</p>
				</div>
				<script>
					document.getElementById("yr").innerHTML = new Date().getFullYear();
				</script>
			</footer>
			<div class="waterMark"></div>

			<!-- Instagram Popup Modal -->
			<div
				class="insta-overlay"
				id="instaOverlay"
				onclick="handleOverlayClick(event)"
			>
				<div class="insta-popup" id="instaPopup">
					<div class="popup-inner">
						<div class="popup-icon"><i class="fab fa-instagram"></i></div>
						<h3>Follow us on Instagram</h3>
						<p>Choose which account you'd like to visit</p>
						<div class="popup-btns">
							<a
								href="https://www.instagram.com/chambers_fossceal"
								target="_blank"
								class="btn-chamber"
							>
								<i class="fas fa-building"></i>
								FOSS Chambers
							</a>
							<a
								href="https://www.instagram.com/fossceal?igsh=OThmdWVlYnFtdndn"
								target="_blank"
								class="btn-foss"
							>
								<i class="fab fa-instagram"></i>
								FOSS CEAL
							</a>
						</div>
						<button
							class="popup-close"
							onclick="
								document.getElementById('instaOverlay').classList.remove('active')
							"
						>
							✕ Close
						</button>
					</div>
				</div>
			</div>

			<script>
				function handleOverlayClick(e) {
					if (!document.getElementById("instaPopup").contains(e.target)) {
						document.getElementById("instaOverlay").classList.remove("active");
					}
				}
				document.addEventListener("keydown", function (e) {
					if (e.key === "Escape")
						document.getElementById("instaOverlay").classList.remove("active");
				});
			</script>

	</body>
