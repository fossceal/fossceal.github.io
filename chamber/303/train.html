<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train303 | FOSS</title>

    <link rel="stylesheet" href="/fonts/font.css" />
    <link id="h1n1" rel="stylesheet" href="/style.css" />
    <script defer src="/dmode.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Open Sans', sans-serif;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .about-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            text-align: center;
        }

        .about-content {
            width: 100%;
            max-width: 720px;
        }

        .about-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            margin: 0 0 24px;
            letter-spacing: -0.5px;
        }

        .about-desc {
            font-size: clamp(0.95rem, 2.5vw, 1.15rem);
            line-height: 1.75;
            opacity: 0.85;
            margin: 0 auto;
        }

        .stats-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(20px, 6vw, 60px);
            margin: 48px 0;
            padding: 32px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .stat-item {
            min-width: 120px;
        }

        .stat-number {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 800;
            color: #00ccff;
        }

        .stat-label {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.7;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .about-logo {
            width: 140px;
        }

        .about-logo img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        @media (min-width: 900px) {
            .about-container {
                flex-direction: row;
                align-items: center;
                text-align: left;
                gap: 64px;
                padding: 64px 48px;
            }

            .about-content {
                max-width: 640px;
            }

            .about-logo {
                width: 300px;
                transform: translateX(120px);
            }

            .stats-container {
                display: flex;
                gap: 48px;
            }

            .stat-item:last-child {
                grid-column: auto;
            }

            .about-container {
                padding-right: 64px;
            }

        }

        @media (min-width: 1200px) {
            .about-container {
                padding: 80px 0;
            }

            .about-content {
                max-width: 720px;
            }
        }

        @media (max-width: 600px) {
            .about-content {
                max-width: 92%;
            }

            .about-desc {
                font-size: 0.95rem;

            }

            .about-title {
                margin-bottom: 16px;
            }

            .stats-container {
                border-top: none;
            }


            .stats-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px 12px;
                margin: 32px 0;
                padding: 24px 0;
                text-align: center;
            }

            .stat-item {
                min-width: auto;
            }

            .stat-number {
                font-size: 2.2rem;
            }

            .insta-btn {
                padding: 14px 28px;
                font-size: 0.95rem;
            }

            .about-logo {
                width: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="headder">
        <img src="/arrBWD_black.png" id="back" onclick="location.href='/chamber/chambers.html'" style="cursor:pointer">
        <img src="/Evantage_dark_HZ.png" id="headerLogo" onclick="location.href='/'">
    </div>

    <div style="height: 120px; width: 100%"></div>

    <div class="about-container">

        <div class="about-content">
            <h1 class="about-title">What is Train 303?</h1>

            <p class="about-desc">
                Train 303 is a skill refinement chamber focused on Full Stack Development
                and AI workflows. Members train through structured builds and real-world
                systems.
            </p>

            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-number" data-target="40">0</span>
                    <div class="stat-label">Members</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-target="10">0</span>
                    <div class="stat-label">Projects</div>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-target="1000">0</span>
                    <div class="stat-label">Hours</div>
                </div>
            </div>
        </div>

        <div class="about-logo">
            <img src="/chamber/303/303_clr_dark.png" id="303Logo">
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.stat-number').forEach(counter => {
                const target = +counter.dataset.target;
                let value = 0;
                const step = target / 100;

                const update = () => {
                    value += step;
                    if (value < target) {
                        counter.textContent = Math.floor(value);
                        requestAnimationFrame(update);
                    } else {
                        counter.textContent = target + "+";
                    }
                };

                update();
            });
        });
    </script>

</body>

</html>
